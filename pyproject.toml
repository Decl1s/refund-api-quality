[project]
name = "refund-api-quality"
version = "0.1.0"
description = "Я проверяю частичные возвраты: API, идемпотентность и конкуренция"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "api: я проверяю HTTP-контракт через ASGI TestClient",
  "concurrency: я проверяю реальное соперничество SQLite-соединений",
  "property: я проверяю инварианты на генерируемых примерах",
]

[tool.coverage.run]
source = ["refund_api"]
branch = true
omit = ["refund_api/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
